<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- speed lines -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="150" y1="66" x2="205" y2="66"/>
    <line x1="130" y1="78" x2="200" y2="78"/>
    <line x1="112" y1="90" x2="195" y2="90"/>
  </g>

  <!-- Diamond icon, centered around x=320 -->
  <g transform="translate(320,120)">
    <!-- top facet -->
    <polygon points="0,-70 62,-6 0,20 -62,-6" fill="#FFFFFF" opacity="0.95"/>
    <!-- left facet -->
    <polygon points="-62,-6 0,20 0,96 -62,30" fill="#FFFFFF" opacity="0.65"/>
    <!-- right facet -->
    <polygon points="62,-6 0,20 0,96 62,30" fill="#FFFFFF" opacity="0.8"/>
    <!-- center highlight edge -->
    <line x1="0" y1="20" x2="0" y2="96" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
    <!-- sparkle -->
    <path d="M -6 -46 L -3 -38 L 5 -35 L -3 -32 L -6 -24 L -9 -32 L -17 -35 L -9 -38 Z" fill="#FFFFFF"/>
  </g>

  <!-- wave underline -->
  <path d="M 190 210 Q 320 190 450 210" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.5"/>

  <!-- wordmark -->
  <text x="320" y="268" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="56" letter-spacing="10" fill="#FFFFFF">SAPHIRE</text>
  <text x="320" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="300" font-size="34" letter-spacing="14" fill="#FFFFFF" opacity="0.75">SHEET</text>
</svg>
