<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="crownTop" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4db8e8"/>
      <stop offset="40%" stop-color="#2a7cc4"/>
      <stop offset="100%" stop-color="#1a5a9e"/>
    </linearGradient>
    
    <linearGradient id="crownLeft" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0%" stop-color="#1e4a80"/>
      <stop offset="50%" stop-color="#2a6ab0"/>
      <stop offset="100%" stop-color="#1e4a80"/>
    </linearGradient>
    
    <linearGradient id="girdle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a8cd8"/>
      <stop offset="100%" stop-color="#1a5a9e"/>
    </linearGradient>
    
    <linearGradient id="pavLeft" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1e5090"/>
      <stop offset="100%" stop-color="#0d2850"/>
    </linearGradient>
    
    <linearGradient id="pavCenter" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#2a6ab0"/>
      <stop offset="50%" stop-color="#1a4a85"/>
      <stop offset="100%" stop-color="#0f3058"/>
    </linearGradient>
    
    <linearGradient id="pavRight" x1="1" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#1a4575"/>
      <stop offset="100%" stop-color="#0a2040"/>
    </linearGradient>
    
    <radialGradient id="highlight" cx="0.35" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#7dd4ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2a6ab0" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="edgeShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4db8e8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.55  0 0 0 0 0.95  0 0 0 0.4 0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Diamond icon centered at 32,30 -->
  <g transform="translate(32, 30)" filter="url(#glow)">
    <!-- Crown -->
    <polygon points="0,-20 -18,-4 -8,-4" fill="url(#crownLeft)"/>
    <polygon points="0,-20 8,-4 18,-4" fill="url(#crownTop)"/>
    
    <!-- Girdle -->
    <polygon points="-18,-4 -20,0 20,0 18,-4" fill="url(#girdle)"/>
    
    <!-- Pavilion -->
    <polygon points="-20,0 0,20 -8,0" fill="url(#pavLeft)"/>
    <polygon points="-8,0 0,20 8,0" fill="url(#pavCenter)"/>
    <polygon points="8,0 0,20 20,0" fill="url(#pavRight)"/>
    
    <!-- Highlight -->
    <polygon points="0,-20 -12,-2 12,-2" fill="url(#highlight)"/>
    
    <!-- Edge shine -->
    <line x1="0" y1="-20" x2="-8" y2="-4" stroke="url(#edgeShine)" stroke-width="0.8"/>
    
    <!-- Three horizontal lines (data reference) -->
    <line x1="-15" y1="-12" x2="-5" y2="-12" stroke="#6ac8e8" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="-16" y1="-8" x2="-5" y2="-8" stroke="#6ac8e8" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="-17" y1="-4" x2="-6" y2="-4" stroke="#6ac8e8" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>