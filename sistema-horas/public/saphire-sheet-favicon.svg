<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF3FC"/>
      <stop offset="100%" stop-color="#BFDCF5"/>
    </linearGradient>
    <linearGradient id="fLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B7DC4"/>
      <stop offset="100%" stop-color="#1C4E8C"/>
    </linearGradient>
    <linearGradient id="fRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5AA6"/>
      <stop offset="100%" stop-color="#0E3266"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3266"/>
      <stop offset="100%" stop-color="#081F42"/>
    </linearGradient>
  </defs>

  <!-- rounded square backdrop so it reads well as a favicon -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- diamond, centered -->
  <g transform="translate(32,33)">
    <polygon points="0,-19 17,-2 0,6 -17,-2" fill="url(#fTop)"/>
    <polygon points="-17,-2 0,6 0,20 -17,8" fill="url(#fLeft)"/>
    <polygon points="17,-2 0,6 0,20 17,8" fill="url(#fRight)"/>
    <line x1="0" y1="6" x2="0" y2="20" stroke="#EAF3FC" stroke-width="0.8" opacity="0.5"/>
  </g>
</svg>
