<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Ícone de safira facetada em corte brilhante, com cinco facetas em tons variados de navy e uma faceta sage, linhas de brilho nas arestas, pequenos brilhos tipo estrela ao redor da gema, marcações de grade na cintura, onda sage abaixo, e o nome Saphire Sheet com a frase gestão de horas e demandas.</desc>

