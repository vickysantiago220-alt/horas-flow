<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF3FC"/>
      <stop offset="100%" stop-color="#BFDCF5"/>
    </linearGradient>
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B7DC4"/>
      <stop offset="100%" stop-color="#1C4E8C"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5AA6"/>
      <stop offset="100%" stop-color="#0E3266"/>
    </linearGradient>
    <linearGradient id="facetBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E3266"/>
      <stop offset="100%" stop-color="#081F42"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#123C70"/>
      <stop offset="100%" stop-color="#1E5AA6"/>
    </linearGradient>
  </defs>

  <!-- speed lines -->
  <g stroke="#2E6BB0" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="150" y1="66" x2="205" y2="66"/>
    <line x1="130" y1="78" x2="200" y2="78"/>
    <line x1="112" y1="90" x2="195" y2="90"/>
  </g>

  <!-- Diamond icon, centered around x=320 -->
  <g transform="translate(320,120)">
    <!-- top facet -->
    <polygon points="0,-70 62,-6 0,20 -62,-6" fill="url(#facetTop)"/>
    <!-- left facet -->
    <polygon points="-62,-6 0,20 0,96 -62,30" fill="url(#facetLeft)"/>
    <!-- right facet -->
    <polygon points="62,-6 0,20 0,96 62,30" fill="url(#facetRight)"/>
    <!-- bottom shading sliver for depth -->
    <polygon points="-62,30 0,96 62,30 0,70" fill="url(#facetBottom)" opacity="0.35"/>
    <!-- center highlight edge -->
    <line x1="0" y1="20" x2="0" y2="96" stroke="#EAF3FC" stroke-width="1.5" opacity="0.5"/>
    <!-- sparkle -->
    <g fill="#F4FAFF">
      <path d="M -6 -46 L -3 -38 L 5 -35 L -3 -32 L -6 -24 L -9 -32 L -17 -35 L -9 -38 Z" opacity="0.9"/>
    </g>
  </g>

  <!-- wave underline -->
  <path d="M 190 210 Q 320 190 450 210" stroke="#8FC1EE" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- wordmark -->
  <text x="320" y="268" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="56" letter-spacing="10" fill="url(#textGrad)">SAPHIRE</text>
  <text x="320" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="300" font-size="34" letter-spacing="14" fill="#6FA8D8">SHEET</text>
</svg>
